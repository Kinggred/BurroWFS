name: Build & Publish BurroWFS Docker Image

# Manual trigger for any branch
on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # allow pushing to GHCR using GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/kinggred/burrowfs:latest
            ghcr.io/kinggred/burrowfs:${{ github.ref_name }}-${{ github.sha }}

      - name: Show image info
        run: |
          echo "✅ Image pushed to GHCR:"
          echo "   ghcr.io/kinggred/burrowfs:latest"
          echo "   ghcr.io/kinggred/burrowfs:${{ github.ref_name }}-${{ github.sha }}"
