name: Build & Publish BurroWFS Docker Image (Manual for PRs)

# Available for manual run on PRs or any branch
on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened]

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    if: github.event_name == 'workflow_dispatch'  # Run only when manually triggered

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/kinggred/burrowfs:pr-${{ github.event.pull_request.number }}
            ghcr.io/kinggred/burrowfs:${{ github.ref_name }}-${{ github.sha }}

      - name: Show image info
        run: |
          echo "✅ PR Build for: ${{ github.event.pull_request.head.ref }}"
          echo "✅ Image tags:"
          echo "   ghcr.io/kinggred/burrowfs:pr-${{ github.event.pull_request.number }}"
          echo "   ghcr.io/kinggred/burrowfs:${{ github.ref_name }}-${{ github.sha }}"
